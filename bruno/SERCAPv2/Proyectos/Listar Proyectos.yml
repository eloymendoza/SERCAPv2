info:
  name: Listar Proyectos
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/catalogos/proyectos"
  headers:
    - name: Accept
      value: application/json
    - name: Referer
      value: "{{base_url}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrf_token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
