info:
  name: Editar Unidad Organizacional
  type: http
  seq: 1

http:
  method: PATCH
  url: "{{base_url}}/api/catalogos/unidades-organizativas/262"
  headers:
    - name: Accept
      value: application/json
    - name: Referer
      value: "{{base_url}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrf_token}}"
  body:
    type: json
    data: "{\r

      \    \"parent_id\": null,\r

      \    \"nivel\": \"direccion\",\r

      \    \"nombre\": \"Tecnológias de la Información\",\r

      \    \"abreviatura\": \"DTI\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
