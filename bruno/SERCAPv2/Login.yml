info:
  name: Login
  type: http
  seq: 9

http:
  method: POST
  url: "{{base_url}}/api/login"
  headers:
    - name: Accept
      value: application/json
    - name: Referer
      value: "{{base_url}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrf_token}}"
    - name: Origin
      value: "{{base_url}}"
  body:
    type: json
    data: "{\r

      \    \"username\": \"{{username}}\",\r

      \    \"password\": \"{{password}}\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
