info:
  name: Listar Puestos
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/catalogos/puestos"
  headers:
    - name: Accept
      value: application/json
    - name: Referer
      value: "{{base_url}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrf_token}}"
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
